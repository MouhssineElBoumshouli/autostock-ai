record_provenance:
  new_company_products_partners_orders_pickings_moves: all_created_in_fresh_target_database
  stable_key_strategy: model_specific_external_id_and_fixture_key
  numeric_ids_from_old_database: never_used
  created_at_fields: actual_odoo_create_date_and_create_uid
  historical_effective_dates: only_new_demo_orders_pickings_and_moves_from_pinned_manifest
  update_or_delete_existing_completed_events: forbidden
  no_write_sql_or_quant_helpers: true

stock_reconciliation:
  scope: new_database_records_only
  per_key: [product, location, inventory_uom]
  equation: opening_adjustment_plus_receipts_plus_returns_plus_transfer_in_minus_completed_deliveries_minus_transfer_out_plus_adjustments_equals_on_hand
  native_inventory_adjustment_required: true
  direct_sql_or_forced_quant: forbidden
  intermediate_negative_balance: forbidden
  reservations_separate_from_on_hand: true
  transfers_count_as_sales_demand: false
  old_database_reconciliation_claim: forbidden

safety_and_idempotency:
  default_mode: dry_run
  dry_run_read_only_transaction: true
  dry_run_must_not_allocate_sequences_or_xmlids: true
  dry_run_must_not_create_write_unlink_or_queue_forecasts: true
  apply_execution_in_this_task: forbidden
  apply_requires_future_separate_owner_approval: true
  apply_requires_exact_target_uuid_confirmation: true
  require_compose_project_db_cluster_and_volume_cross_checks: true
  require_matching_db_and_filestore_backup_manifest_before_apply: true
  deny_original_endpoint_containers_and_volumes: true
  idempotent_replay_same_dataset_version: zero_creates_and_zero_writes
  changed_completed_event: new_version_and_disposable_restore_required
  conflict_or_duplicate_fixture_key: abort_before_any_write
  startup_seeding: false
  destructive_cleanup_or_volume_flags: forbidden
  dry_run_checks_original_showroom: never_connect_to_it
