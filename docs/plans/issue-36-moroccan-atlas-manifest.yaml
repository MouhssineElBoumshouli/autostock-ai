currency_decision:
  state: owner_choice_required_before_importer_code
  current_company_currency: USD
  mad_currency_active: false
  recommendation: preserve_existing_usd_company_and_use_explicit_mad_terms_or_validated_mad_pricelists_only
  tax_presentation:
    all_illustrative_sale_and_supplier_prices: tax_exclusive_display_assumption
    rates_or_tax_mapping: none_supplied_or_approved
    approval_required_before_orders: true
  illustrative_product_sale_prices_apply_only_after_explicit_mad_pricelist_or_mad_company_is_approved: true
  alternatives:
    - key: existing_company_usd
      choice: retain_one_existing_company_usd_and_use_explicit_mad_vendor_terms_or_only_validated_mad_pricelists
      benefit: preserves_single_company_and_implicit_legacy_amounts
      tradeoff: no_company_wide_mad_reporting_or_unlabelled_monetary_aggregates
      recommended: true
    - key: separate_mad_company
      choice: keep_existing_atlas_company_usd_and_add_moroccan_company_mad_in_clone
      benefit: preserves_legacy_ids_and_currency_semantics_while_supporting_a_mad_business_view
      tradeoff: showroom_contains_two_companies; existing_sales_history_is_not_moved; copied_products_start_with_actual_creation_dates
    - key: approved_currency_migration
      choice: change_existing_company_to_mad_only_with_owner_supplied_dated_fx_and_accounting_plan
      benefit: preserves_single_company_identity
      tradeoff: complex_implicit_price_cost_and_valuation_migration; posted_history_must_not_be_relabelled
    - key: clean_moroccan_database
      choice: create_separate_database_with_one_mad_company
      benefit: simplest_single_company_mad_semantics
      tradeoff: does_not_extend_existing_record_ids_or_order_history
  field_compatibility:
    - {model_field: res.company.currency_id, semantics: company_base_currency, migration_policy: do_not_switch_without_owner_approved_path}
    - {model_field: res.currency, semantics: active_currency_and_separately_dated_rates, migration_policy: activate_mad_only_after_choice; do_not_invent_rates}
    - {model_field: product.template.list_price, semantics: company_currency_implicit, migration_policy: preserve_existing_values_and_do_not_relabel}
    - {model_field: product.product.standard_price, semantics: company_dependent_company_currency_implicit, migration_policy: preserve_existing_values_and_do_not_relabel}
    - {model_field: product.supplierinfo.price_and_min_qty_tiers, semantics: explicit_currency_per_term_and_native_price_break, migration_policy: preserve_usd_terms_and_store_new_mad_terms_as_mad}
    - {model_field: sale.order.currency_id_and_sale.order.line.price_unit, semantics: explicit_order_currency_and_line_amounts, migration_policy: preserve_historic_order_currency}
    - {model_field: account.move.currency_id_amount_currency_balance, semantics: foreign_amount_may_be_explicit_but_balance_is_company_currency, migration_policy: audit_and_never_rewrite_posted_history}
    - {model_field: stock.valuation.layer.value, semantics: company_currency_implicit, migration_policy: keep_legacy_values_and_audit_before_base_currency_change}
    - {model_field: autostock.api.company_currency_and_supplier_term_currency, semantics: company_currency_metadata_plus_explicit_term_currency, migration_policy: never_infer_currency_for_ambiguous_values_or_aggregate_mixed_currencies}

record_creation_policy:
  existing_records: never_rewrite_create_date_or_create_uid
  new_products: use_actual_odoo_orm_create_timestamp
  historical_events_before_product_creation: forbidden
  simulated_create_date: not_approved
  new_product_opening_stock: native_adjustment_at_or_after_actual_product_creation
  dated_sales_receipts_returns_transfers: only_retained_products_created_2026_04_13
  initial_181_day_forecast_scope: four_retained_products_created_2026_04_13_only_subject_to_data_quality_gates
  retained_products_created_2026_10_10: no_pre_creation_history_or_long_forecast
  newly_created_products: insufficient_history_until_valid_post_creation_observations_accrue
  broader_synthetic_history: requires_separate_owner_approved_provenance_design_and_clone_only_gate

