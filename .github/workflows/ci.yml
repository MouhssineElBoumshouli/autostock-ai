name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q addons ml scripts tests

      - name: Evaluate the labeled synthetic fixture
        run: |
          python scripts/generate_synthetic_sales.py
          python -m ml.evaluate ml/output/synthetic_daily_sales.csv --days 30 --output "$RUNNER_TEMP/forecast.json"
