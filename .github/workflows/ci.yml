name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q addons ml scripts tests

      - name: Check Moroccan PowerShell Status without starting Docker services
        shell: pwsh
        run: |
          ./scripts/moroccan_showroom/prepare.ps1 -Action Prepare
          ./scripts/moroccan_showroom/prepare.ps1 -Action Status

      - name: Evaluate the labeled synthetic fixture
        run: |
          python scripts/generate_synthetic_sales.py
          python -m ml.evaluate ml/output/synthetic_daily_sales.csv --days 30 --output "$RUNNER_TEMP/forecast.json"

  frontend:
    name: React frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run Odoo API contract tests
        run: npm run test:contract

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run responsive browser tests
        run: npm run test:browser

      - name: Build production frontend
        run: npm run build

  odoo-integration:
    name: Odoo 19 integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull Odoo and PostgreSQL from the public Docker image cache
        run: |
          docker pull mirror.gcr.io/library/postgres:16
          docker tag mirror.gcr.io/library/postgres:16 postgres:16
          docker pull mirror.gcr.io/library/odoo:19.0-20260926
          docker tag mirror.gcr.io/library/odoo:19.0-20260926 odoo:19.0

      - name: Install addon and run Odoo tests against PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          project="autostock-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target_uuid="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          export POSTGRES_USER=autostock_ci
          # Hex characters avoid Odoo's wait-for-psql argv parser treating a
          # URL-safe password beginning with '-' as another command-line flag.
          export POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export POSTGRES_DB=postgres
          echo "::add-mask::$POSTGRES_PASSWORD"

          cleanup() {
            docker compose --project-name "$project" down --volumes --remove-orphans
          }
          trap cleanup EXIT

          docker compose --project-name "$project" up --detach --wait db
          docker compose --project-name "$project" run --rm --no-deps \
            --volume "$PWD/scripts:/mnt/scripts:ro" \
            --env "PYTHONPATH=/mnt:/opt/autostock-ai/python:/opt/autostock-ai" \
            --env "AUTOSTOCK_DEMO_TARGET_UUID=$target_uuid" \
            odoo odoo \
            --database=autostock_atlas_morocco_demo \
            --init=autostock_ai \
            --test-enable \
            --test-tags=/autostock_ai \
            --stop-after-init \
            --without-demo=true \
            --log-level=test

  moroccan-restore-proof:
    name: Moroccan backup restore proof
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull Odoo and PostgreSQL from the public Docker image cache
        run: |
          docker pull mirror.gcr.io/library/postgres:16
          docker tag mirror.gcr.io/library/postgres:16 postgres:16
          docker pull mirror.gcr.io/library/odoo:19.0-20260926
          docker tag mirror.gcr.io/library/odoo:19.0-20260926 odoo:19.0

      - name: Run real disposable database and filestore restore proof
        shell: bash
        run: bash scripts/moroccan_showroom/ci_restore_proof.sh
