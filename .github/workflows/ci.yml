name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Set up Node.js for the disposable QA database guard
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Test that browser QA refuses non-disposable databases before browser or network access
        run: node --test scripts/test_qa_phase3a_browser_guard.mjs

      - name: Check AutoStock Owl and browser QA JavaScript syntax
        run: |
          node --input-type=module --check < addons/autostock_ai/static/src/dashboard/dashboard.js
          node --check scripts/qa_showroom_browser.mjs
          node --check scripts/qa_phase3a_browser.mjs
          node --check scripts/qa_dashboard_browser.mjs

      - name: Compile Python sources
        run: python -m compileall -q addons ml scripts tests

      - name: Evaluate the labeled synthetic fixture
        run: |
          python scripts/generate_synthetic_sales.py
          python -m ml.evaluate ml/output/synthetic_daily_sales.csv --days 30 --output "$RUNNER_TEMP/forecast.json"

  odoo-integration:
    name: Odoo 19 integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull Odoo and PostgreSQL from the public Docker image cache
        run: |
          docker pull mirror.gcr.io/library/postgres:16
          docker tag mirror.gcr.io/library/postgres:16 postgres:16
          docker pull mirror.gcr.io/library/odoo:19.0-20260926
          docker tag mirror.gcr.io/library/odoo:19.0-20260926 odoo:19.0

      - name: Install addon and run Odoo tests against PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          project="autostock-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export POSTGRES_USER=autostock_ci
          export POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export POSTGRES_DB=postgres
          echo "::add-mask::$POSTGRES_PASSWORD"

          cleanup() {
            docker compose --project-name "$project" down --volumes --remove-orphans
          }
          trap cleanup EXIT

          docker compose --project-name "$project" up --detach --wait db
          docker compose --project-name "$project" run --rm --no-deps odoo odoo \
            --database=autostock_ci \
            --init=autostock_ai \
            --test-enable \
            --test-tags=/autostock_ai \
            --stop-after-init \
            --without-demo=true \
            --log-level=test
