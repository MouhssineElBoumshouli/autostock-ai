name: autostock-shop

# AutoStock on a shop's computer. Install guide: docs/INSTALL.md.
# Start (and after an update):  docker compose -f docker-compose.prod.yml up -d --build
# Stop:                         docker compose -f docker-compose.prod.yml stop
# Website: http://localhost:8080 on this PC, http://<this PC's address>:8080 on the others.
# Settings come from .env (copy .env.example). Developing? Use docker compose up (docker-compose.yml).
#
# The shop's data lives in the Docker volume "autostock-shop_db_data", never in this folder, so the
# folder can be replaced by a new version. Only .env and the backups folder must be kept.

x-shop: &shop
  restart: unless-stopped # comes back by itself after a reboot or a power cut
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" } # at most 30 MB of logs per service
  environment: &shop-env
    TZ: Africa/Casablanca

x-database-login: &database-login
  POSTGRES_USER: ${POSTGRES_USER:-autostock}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Put a strong POSTGRES_PASSWORD in the .env file first (docs/INSTALL.md, step 4)}
  POSTGRES_DB: ${POSTGRES_DB:-autostock}

services:
  db:
    <<: *shop
    build: ./backend/scripts
    image: autostock-shop-postgres
    # Room for big queries done in parallel (Docker's default 64 MB makes them fail on a big shop).
    shm_size: 512mb
    # Refuses a weak password before the database is ever created with it.
    entrypoint: ["sh", "-c", "check-password.sh && exec docker-entrypoint.sh postgres"]
    environment:
      <<: [*shop-env, *database-login]
    volumes:
      - db_data:/var/lib/postgresql/data
    # No "ports": the database is only reachable by the app and the backups, inside Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    <<: *shop
    build: .
    image: autostock-shop-app
    environment:
      <<: *shop-env
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autostock}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autostock}
      # Optional: extra addresses allowed to save, only behind a proxy (.env.example).
      APP_URL: ${APP_URL:-http://localhost:8080}
      BACKUP_DIR: /backups
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - ./backups:/backups # every day's backup, and those made before an update or a restore (app/backups.py)
    depends_on:
      db:
        condition: service_healthy

  # Optional, free, local AI for "Ask your shop" (docs/INSTALL.md, "Turn on the AI"):
  #   docker compose -f docker-compose.prod.yml --profile ai-gpu up -d   (NVIDIA graphics card)
  #   docker compose -f docker-compose.prod.yml --profile ai up -d       (no graphics card, slower)
  ollama: &ollama
    <<: *shop
    image: ollama/ollama:0.12.6
    profiles: ["ai"]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen3:4b-instruct} && wait"]
    environment:
      <<: *shop-env
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama_models:/root/.ollama

  ollama-gpu:
    <<: *ollama
    profiles: ["ai-gpu"]
    networks:
      default:
        aliases: [ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  db_data:
  ollama_models:
