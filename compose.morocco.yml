name: autostock-atlas-morocco

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Prepare .env.atlas-morocco first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Prepare .env.atlas-morocco first}
      POSTGRES_DB: postgres
    volumes:
      - morocco_postgres:/var/lib/postgresql/data
    networks:
      - morocco_private
    labels:
      com.autostock.environment: morocco-demo
      com.autostock.target-uuid: ${ATLAS_MOROCCO_TARGET_UUID:?Prepare .env.atlas-morocco first}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: autostock-ai-odoo-morocco:19.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command:
      - python3
      - /mnt/atlas-morocco/start_web.py
    ports:
      - "127.0.0.1:${ODOO_PORT:-8070}:8069"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:?Prepare .env.atlas-morocco first}
      PASSWORD: ${POSTGRES_PASSWORD:?Prepare .env.atlas-morocco first}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:?Prepare .env.atlas-morocco first}
      AUTOSTOCK_DEMO_TARGET_UUID: ${ATLAS_MOROCCO_TARGET_UUID:?Prepare .env.atlas-morocco first}
    volumes:
      - morocco_filestore:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
      - ./scripts/moroccan_showroom:/mnt/atlas-morocco:ro
    networks:
      - morocco_private
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8069), 3); s.close()"
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 10s
    labels:
      com.autostock.environment: morocco-demo
      com.autostock.target-uuid: ${ATLAS_MOROCCO_TARGET_UUID:?Prepare .env.atlas-morocco first}
networks:
  morocco_private:
    name: autostock-atlas-morocco-private
    labels:
      com.autostock.environment: morocco-demo
      com.autostock.target-uuid: ${ATLAS_MOROCCO_TARGET_UUID:?Prepare .env.atlas-morocco first}

volumes:
  morocco_postgres:
    name: autostock_atlas_morocco_postgres
    labels:
      com.autostock.environment: morocco-demo
      com.autostock.target-uuid: ${ATLAS_MOROCCO_TARGET_UUID:?Prepare .env.atlas-morocco first}
  morocco_filestore:
    name: autostock_atlas_morocco_filestore
    labels:
      com.autostock.environment: morocco-demo
      com.autostock.target-uuid: ${ATLAS_MOROCCO_TARGET_UUID:?Prepare .env.atlas-morocco first}
