name: autostock

# Start everything with: docker compose up
# Website: http://localhost:5173 (it forwards /api requests to the server).
# Settings come from .env (copy .env.example). Without it, the defaults below are used.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autostock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autostock}
      POSTGRES_DB: ${POSTGRES_DB:-autostock}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autostock}:${POSTGRES_PASSWORD:-autostock}@db:5432/${POSTGRES_DB:-autostock}
      # The address people type to open the website. Used to reject requests from other sites.
      APP_URL: ${APP_URL:-http://localhost:5173}
      # Docker Desktop on Windows does not always pass file-change events into containers,
      # so the server checks for changes regularly instead. This keeps auto-reload working.
      WATCHFILES_FORCE_POLLING: "true"
      # Optional local AI for "Ask your shop". If it isn't running, the app says "AI is off".
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    # npm install keeps packages in sync if package.json changed since the image was built.
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      # Read-only, for `npm test`: it checks every server message has a French and an Arabic version.
      - ./backend/app:/backend/app:ro
    depends_on:
      - api

  # Optional, free, local AI. Start it with: docker compose --profile ai up
  # The first start downloads the model once (about 2-5 GB). Nothing leaves this computer.
  ollama: &ollama
    image: ollama/ollama:0.12.6
    profiles: ["ai"]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen2.5:3b} && wait"]
    environment:
      # Room for the shop's numbers the model reads before answering.
      OLLAMA_CONTEXT_LENGTH: "8192"
      # Uses less graphics-card memory, so more of the model fits there (faster).
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama_models:/root/.ollama

  # The same local AI on an NVIDIA graphics card: several times faster.
  # Start it with: docker compose --profile ai-gpu up   (needs Docker Desktop with WSL 2 and an NVIDIA driver)
  ollama-gpu:
    <<: *ollama
    profiles: ["ai-gpu"]
    networks:
      default:
        aliases: [ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  db_data:
  web_node_modules:
  ollama_models:
